name: DaddyLive Only IPTV

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install deps
        run: pip install requests

      - name: Generate DaddyLive playlist
        run: |
          python <<EOF
          import requests

          m3u = "#EXTM3U\n\n"

          try:
              events = requests.get("https://daddylive.org/api/events", timeout=10).json()
          except:
              events = []

          count = 0

          for e in events:
              name = str(e.get("title", "")).strip()

              stream = (
                  str(e.get("stream", "")) or
                  str(e.get("link", "")) or
                  str(e.get("url", ""))
              ).strip()

              if name and stream.startswith("http"):
                  m3u += f'#EXTINF:-1 group-title="DaddyLive",{name}\n'
                  m3u += f"{stream}\n\n"
                  count += 1

          # Əgər heç stream tapılmasa
          if count == 0:
              m3u += "#EXTINF:-1,DaddyLive (No Streams Available)\n"
              m3u += "about:blank\n"

          with open("playlist.m3u", "w", encoding="utf-8") as f:
              f.write(m3u)
          EOF

      - name: Commit
        run: |
          git config --global user.name "iptv-bot"
          git config --global user.email "bot@github.com"

          git add playlist.m3u
          git commit -m "DaddyLive update" || echo "No changes"
          git push
