name: DaddyLive IPTV Update

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install requirements
        run: pip install requests

      - name: Generate M3U playlist
        run: |
          python <<EOF
          import requests

          url = "https://daddylive.org/api/events"

          try:
              data = requests.get(url, timeout=10).json()
          except:
              data = []

          m3u = "#EXTM3U\n\n"
          count = 0

          for e in data:
              name = str(e.get("title", "")).strip()

              # müxtəlif fieldləri yoxla
              stream = (
                  str(e.get("stream", "")) or
                  str(e.get("link", "")) or
                  str(e.get("url", ""))
              ).strip()

              if not name or not stream:
                  continue
              if not stream.startswith("http"):
                  continue

              # adı təmizlə
              name = name.replace("|", "-").replace("\n", "")

              m3u += f'#EXTINF:-1 tvg-id="{count}" group-title="DaddyLive",{name}\n'
              m3u += f"{stream}\n\n"

              count += 1

          # fallback (əgər heç nə yoxdursa)
          if count == 0:
              m3u += "#EXTINF:-1,No Live Events (Test Channel)\n"
              m3u += "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8\n"

          with open("playlist.m3u", "w", encoding="utf-8") as f:
              f.write(m3u)
          EOF

      - name: Commit and push
        run: |
          git config --global user.name "iptv-bot"
          git config --global user.email "bot@github.com"

          git add playlist.m3u
          git commit -m "Auto update playlist" || echo "No changes"
          git push
