name: DaddyLive Scraper IPTV

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install packages
        run: pip install requests beautifulsoup4

      - name: Scrape DaddyLive
        run: |
          python << 'EOF'
          import requests
          from bs4 import BeautifulSoup
          import re

          headers = {"User-Agent": "Mozilla/5.0"}

          m3u = "#EXTM3U\n\n"
          count = 0

          try:
              home = requests.get("https://daddylive.org/", headers=headers, timeout=10).text
              soup = BeautifulSoup(home, "html.parser")

              links = []

              # stream linklərini tap
              for a in soup.find_all("a", href=True):
                  href = a["href"]
                  if "/stream/" in href:
                      full = "https://daddylive.org" + href
                      links.append(full)

              # duplicate sil + limit
              links = list(set(links))[:10]

              for link in links:
                  try:
                      page = requests.get(link, headers=headers, timeout=10).text
                      matches = re.findall(r"https.*?\.m3u8", page)

                      if matches:
                          stream = matches[0]
                          name = link.split("/")[-1]

                          m3u += f'#EXTINF:-1 group-title="DaddyLive",{name}\n'
                          m3u += f"{stream}\n\n"
                          count += 1
                  except:
                      continue

          except:
              pass

          # fallback
          if count == 0:
              m3u += "#EXTINF:-1,No Streams Found\n"
              m3u += "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8\n"

          with open("playlist.m3u", "w", encoding="utf-8") as f:
              f.write(m3u)
          EOF

      - name: Commit & Push
        run: |
          git config --global user.name "iptv-bot"
          git config --global user.email "bot@github.com"

          git add playlist.m3u
          git commit -m "Scraped update" || echo "No changes"
          git push
