name: DaddyLive Scraper IPTV

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - run: pip install requests beautifulsoup4

      - name: Scrape DaddyLive
        run: |
          python <True):              if "/stream/" in a["href"]:
                  links.append("https://daddylive.org" + a["href"])

          # unikallaşdır
          links = list(set(links))[:10]

          # 3. Hər linkdən stream tapmağa çalış
          for link in links:
              try:
                  page = requests.get(link, headers=headers).text

                  # m3u8 tap
                  m3u8 = re.findall(r"https.*?\.m3u8", page)

                  if m3u8:
                      stream = m3u8[0]
                      name = link.split("/")[-1]

                      m3u += f'#EXTINF:-1 group-title="DaddyLive",{name}\n'
                      m3u += f"{stream}\n\n"

                      count += 1

              except:
                  continue

          # fallback
          if count == 0:
              m3u += "#EXTINF:-1,No Streams Found\n"
              m3u += "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8\n"

          with open("playlist.m3u", "w") as f:
              f.write(m3u)
          EOF

      - name: Commit
        run: |
          git config --global user.name "iptv-bot"
          git config --global user.email "bot@github.com"

          git add playlist.m3u
          git commit -m "Scraped IPTV update" || echo "No changes"
          git push
