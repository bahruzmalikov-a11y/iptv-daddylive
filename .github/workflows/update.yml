name: DaddyLive IPTV Update

on:
  schedule:
    - cron: "*/5 * * * *"   # hər 5 dəqiqə
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Generate M3U
        run: |
          pip install requests

          python <<EOF
          import requests

          url = "https://daddylive.org/api/events"
          data = requests.get(url, timeout=10).json()

          m3u = "#EXTM3U\n\n"
          count = 0

          for e in data:
              name = e.get("title", "").strip()
              stream = e.get("stream", "").strip()

              # Filter
              if not name or not stream:
                  continue
              if not stream.startswith("http"):
                  continue

              # Clean name
              name = name.replace("|", "-").replace("\n", "")

              m3u += f'#EXTINF:-1 tvg-id="{count}" group-title="DaddyLive",{name}\n'
              m3u += f"{stream}\n\n"

              count += 1

          if count == 0:
              m3u += "#EXTINF:-1,No Streams Available\nhttps://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8\n"

          with open("playlist.m3u", "w", encoding="utf-8") as f:
              f.write(m3u)
          EOF

      - name: Commit & Push
        run: |
          git config --global user.name "iptv-bot"
          git config --global user.email "bot@github.com"
          git add playlist.m3u
          git commit -m "Auto update playlist" || echo "No changes"
          git push
