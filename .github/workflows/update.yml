name: Full IPTV System

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install deps
        run: pip install requests

      - name: Build playlist
        run: |
          python <<EOF
          import requests

          m3u = "#EXTM3U\n\n"
          count = 0

          # ✅ 1. DaddyLive
          try:
              data = requests.get("https://daddylive.org/api/events", timeout=10).json()
          except:
              data = []

          for e in data:
              name = str(e.get("title", "")).strip()
              stream = (
                  str(e.get("stream", "")) or
                  str(e.get("link", "")) or
                  str(e.get("url", ""))
              ).strip()

              if name and stream.startswith("http"):
                  m3u += f'#EXTINF:-1 group-title="DaddyLive",{name}\n'
                  m3u += f"{stream}\n\n"
                  count += 1

          # ✅ 2. Əgər DaddyLive boşdursa → Backup IPTV
          if count == 0:
              try:
                  backup = requests.get("https://iptv-org.github.io/iptv/categories/sports.m3u", timeout=10).text
                  m3u += backup
              except:
                  pass

          # ✅ 3. Minimum fallback
          if "#EXTINF" not in m3u:
              m3u += "#EXTINF:-1 group-title=\"Backup\",Test Channel\n"
              m3u += "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8\n\n"

          with open("playlist.m3u", "w", encoding="utf-8") as f:
              f.write(m3u)
          EOF

      - name: Commit
        run: |
          git config --global user.name "iptv-bot"
          git config --global user.email "bot@github.com"

          git add playlist.m3u
          git commit -m "Full IPTV update" || echo "No changes"
          git push
